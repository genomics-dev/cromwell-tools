[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cromwell-tools-genomics"
version = "2.5.1"
description = "Utilities for interacting with the Cromwell workflow engine"
readme = "README.rst"
license = {text = "BSD 3-clause 'New' or 'Revised' License"}
authors = [
    {name = "Mint Team", email = "mintteam@broadinstitute.org"}
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Natural Language :: English",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.8",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "requests>=2.20.0,<3",
    "six>=1.11.0",
    "google-auth>=2.38.0",
    "google-api-python-client>=2.161.0",
    "python-dateutil>=2.8,<3",
]

[project.optional-dependencies]
test = [
    "black==19.3b0",
    "flake8==3.7.7",
    "mock>=2.0.0",
    "requests_mock>=1.4.0",
    "pre-commit==1.14.4",
    "pytest-cov>=2.5.1",
    "pytest>=3.6.3",
    "pytest-timeout>=1.3.1",
]

[project.scripts]
cromwell-tools = "cromwell_tools.cli:main"

[project.urls]
Homepage = "http://github.com/broadinstitute/cromwell-tools"
Repository = "http://github.com/broadinstitute/cromwell-tools"

[tool.setuptools.packages.find]
include = ["cromwell_tools*"]
